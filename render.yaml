# Render Blueprint for the Dat.Bike backend (Express API).
# In Render: New > Blueprint > connect this repo. Secrets are set in the dashboard.
services:
  - type: web
    name: datbike-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SAP_BASE_URL
        sync: false
      - key: SAP_USER
        sync: false
      - key: SAP_PASS
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # Cutover serials: material=serial, separated by ';'. Set in the dashboard.
      # Unset = legacy serials are not blocked and the floor falls back to the
      # lowest serial already received for the material.
      - key: SERIAL_CUTOVER
        sync: false
